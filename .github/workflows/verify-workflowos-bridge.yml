name: Verify WorkflowOS bridge

on:
  push:
    branches:
      - workflowos-bridge-secure

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build storefront
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check bridge Edge Function
        run: deno check supabase/functions/workflowos-bridge/index.ts
