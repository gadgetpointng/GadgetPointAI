name: WorkflowOS bridge E2E probe

on:
  push:
    branches:
      - bridge-e2e-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Call hardened live relay
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL=$(sed -n 's/^const WORKFLOWOS_SUPABASE_URL = "\(.*\)";/\1/p' src/lib/workflowosBridge.ts)
          KEY=$(sed -n 's/^const WORKFLOWOS_PUBLISHABLE_KEY = "\(.*\)";/\1/p' src/lib/workflowosBridge.ts)
          test -n "$BASE_URL"
          test -n "$KEY"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Origin: https://gadgetpoint.ng" \
            --header "content-type: application/json" \
            --header "apikey: ${KEY}" \
            --header "authorization: Bearer ${KEY}" \
            --data '{"id":"gadgetpoint-ci-bridge-probe-v2","type":"site.heartbeat","occurred_at":"2026-08-11T22:17:00Z","data":{"name":"GadgetPoint Storefront Hardened Relay Probe","slug":"gadgetpoint-storefront-ci-probe-v2","site_type":"commerce","domain":"gadgetpoint.ng","capabilities":["events"],"metadata":{"connection_test":true,"relay_version":4}}}' \
            "${BASE_URL}/functions/v1/gadgetpoint-workflowos-bridge"
