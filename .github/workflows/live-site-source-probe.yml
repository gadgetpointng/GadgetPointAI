name: Probe WorkflowOS buyer request end to end

on:
  push:
    branches:
      - domain-health-probe

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Submit clearly tagged production buyer request
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header 'user-agent: WorkflowOS-MVP-E2E-Probe/1.0' \
            --data '{"product_query":"Samsung 45W PD Adopter","buyer_name":"WorkflowOS MVP Smoke","email":"workflowos-mvp-smoke@gadgetpoint.ng","budget_max":6000,"city":"Enugu","state":"Enugu","urgency":"high","category":"Charging","brand":"Samsung","contact_consent":true,"attribution_source":"mvp-smoke","campaign":"production-e2e-20260817"}' \
            'https://workflowos-nine.vercel.app/api/public/buyer-request')"
          echo "buyer-request status=${status}"
          cat "$response"
          echo
          test "$status" = '201'
          grep -q '"ok":true' "$response"
          grep -q '"request_id"' "$response"
          grep -q 'Samsung 45W PD Adopter' "$response"
          grep -q '"available":true' "$response"
