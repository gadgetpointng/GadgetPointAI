name: Probe GadgetPoint owner WorkflowOS handoff routes

on:
  push:
    branches:
      - domain-health-probe

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify owner access entry routes exist
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"
            url="$2"
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 -D "$headers" -o "$body" --write-out '%{http_code}' "$url" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); print $2}' "$headers" | tail -n1)"
            printf '%s -> HTTP %s location=%s :: ' "$label" "${status:-curl-error}" "${location:-none}"
            head -c 220 "$body" | tr '\n' ' '
            echo
            rm -f "$headers" "$body"
          }

          probe 'direct owner handoff' 'https://gadgetpoint.ng/api/workflowos/owner-login'
          probe 'owner Admin handoff' 'https://gadgetpoint.ng/admin?workflowos=1'
          probe 'ChatGPT owner sign-in' 'https://gadgetpoint.ng/signin-with-chatgpt?return_to=%2Fadmin%3Fworkflowos%3D1'
