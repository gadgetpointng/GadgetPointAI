name: Inspect live GadgetPoint WorkflowOS access control

on:
  push:
    branches:
      - domain-health-probe

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect live WorkflowOS access client
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location 'https://gadgetpoint.ng/staff-login' -o /tmp/staff.html
          grep -Eo 'assets/workflowos-access-client-[A-Za-z0-9_-]+\.js' /tmp/staff.html | sort -u > /tmp/direct.txt || true

          if [ ! -s /tmp/direct.txt ]; then
            grep -Eo '(src|href)="/[^"]+\.js[^" ]*"' /tmp/staff.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u > /tmp/root-assets.txt || true
            : > /tmp/root.js
            while read -r asset; do
              [ -n "$asset" ] || continue
              curl --fail --silent --show-error --location "https://gadgetpoint.ng${asset}" -o /tmp/root-one.js || continue
              cat /tmp/root-one.js >> /tmp/root.js
              echo >> /tmp/root.js
            done < /tmp/root-assets.txt
            grep -Eo 'assets/workflowos-access-client-[A-Za-z0-9_-]+\.js' /tmp/root.js | sort -u > /tmp/direct.txt || true
          fi

          echo '=== ACCESS CLIENT ASSETS ==='
          cat /tmp/direct.txt
          test -s /tmp/direct.txt

          : > /tmp/access.js
          while read -r asset; do
            [ -n "$asset" ] || continue
            curl --fail --silent --show-error --location "https://gadgetpoint.ng/${asset}" -o /tmp/access-one.js
            cat /tmp/access-one.js >> /tmp/access.js
            echo >> /tmp/access.js
          done < /tmp/direct.txt

          echo '=== API ROUTES ==='
          grep -Eo '/api/[A-Za-z0-9_?&=./:{}-]+' /tmp/access.js | sort -u | head -n 300 || true

          echo '=== WORKFLOW ACCESS CONTRACT ==='
          grep -Eoi '.{0,450}(workflowos_access|workflowosPermissions|workflowos_permissions|accessEnabled|access_enabled|permission|destination|redirectUrl|staff-auth|externalStaffId|username).{0,1000}' /tmp/access.js | head -n 260 || true

          echo '=== FETCH CALL CONTEXT ==='
          grep -Eoi '.{0,350}fetch\([^)]{0,500}\).{0,700}' /tmp/access.js | head -n 180 || true
