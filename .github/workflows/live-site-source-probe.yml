name: Trace live GadgetPoint production site

on:
  push:
    branches:
      - domain-health-probe

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect admin bundle and unauthenticated UI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://gadgetpoint.ng/admin -o /tmp/admin.html
          echo '=== ADMIN ASSETS ==='
          grep -oE 'href="/assets/[^"]+\.js"' /tmp/admin.html | cut -d'"' -f2 | sort -u > /tmp/admin-assets.txt || true
          cat /tmp/admin-assets.txt

          echo '=== ADMIN API / AUTH STRINGS ==='
          : > /tmp/all-admin.js
          while read -r asset; do
            [ -n "$asset" ] || continue
            curl --fail --silent --show-error "https://gadgetpoint.ng${asset}" -o /tmp/admin-asset.js || continue
            cat /tmp/admin-asset.js >> /tmp/all-admin.js
            echo >> /tmp/all-admin.js
          done < /tmp/admin-assets.txt
          grep -Eo 'https?://[^"'"'"'[:space:]<>]+|/api/[A-Za-z0-9_?&=./:{}-]+' /tmp/all-admin.js | sort -u | head -n 250 || true
          echo '=== ADMIN KEYWORDS ==='
          grep -Eoi '.{0,100}(login|password|username|session|cookie|token|staff|owner|integration|webhook|workflow).{0,140}' /tmp/all-admin.js | head -n 160 || true

      - name: Inspect unauthenticated admin runtime safely
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          mkdir -p /tmp/adminprobe && cd /tmp/adminprobe
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save puppeteer-core@24
          cat > probe.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({ executablePath: process.env.CHROME, headless: true, args: ['--no-sandbox','--disable-gpu'] });
          const page = await browser.newPage();
          page.on('pageerror', (err) => console.log(`[pageerror] ${err.message}`));
          page.on('requestfailed', (req) => console.log(`[requestfailed] ${req.method()} ${req.url()} :: ${req.failure()?.errorText}`));
          page.on('response', (res) => {
            if (res.url().includes('/api/')) console.log(`[api] ${res.status()} ${res.request().method()} ${res.url()}`);
          });
          const response = await page.goto('https://gadgetpoint.ng/admin', { waitUntil: 'networkidle2', timeout: 30000 });
          console.log(`[navigation] ${response?.status()} ${page.url()}`);
          const title = await page.title();
          const body = await page.$eval('body', (el) => el.innerText.slice(0, 2000));
          console.log(`[title] ${title}`);
          console.log(`[body] ${body.replace(/\s+/g,' ')}`);
          console.log(`[password-inputs] ${await page.$$eval('input[type="password"]', els => els.length)}`);
          console.log(`[forms] ${await page.$$eval('form', els => els.length)}`);
          await browser.close();
          EOF
          CHROME="$CHROME" node probe.mjs
