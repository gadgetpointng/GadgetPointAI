name: Probe live GadgetPoint Admin messenger auth

on:
  push:
    branches:
      - domain-health-probe

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare session and bridge-shaped unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; shift
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 "$@" --output "$body" --write-out '%{http_code}' 'https://gadgetpoint.ng/api/admin/messages' || true)"
            printf '%s -> HTTP %s :: ' "$label" "${status:-curl-error}"
            head -c 400 "$body" | tr '\n' ' '
            echo
            rm -f "$body"
          }

          probe 'plain GET'
          probe 'dummy bridge GET' -H 'authorization: Bearer definitely-not-a-real-secret' -H 'x-gadgetpoint-bridge-id: definitely-not-a-real-bridge-id'
          probe 'plain POST' -X POST -H 'content-type: application/json' --data '{"action":"read"}'
          probe 'dummy bridge POST' -X POST -H 'content-type: application/json' -H 'authorization: Bearer definitely-not-a-real-secret' -H 'x-gadgetpoint-bridge-id: definitely-not-a-real-bridge-id' --data '{"action":"read","staffUsername":"probe"}'
