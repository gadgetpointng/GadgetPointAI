name: Trace GadgetPoint staff WorkflowOS access contract

on:
  push:
    branches:
      - domain-health-probe

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect staff-login bundle and access APIs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location 'https://gadgetpoint.ng/staff-login' -o /tmp/staff.html
          echo '=== STAFF LOGIN HTML ==='
          head -c 2400 /tmp/staff.html | tr '\n' ' '
          echo

          grep -Eo '(src|href)="/[^"]+\.js[^" ]*"' /tmp/staff.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u > /tmp/assets.txt || true
          : > /tmp/all.js
          while read -r asset; do
            [ -n "$asset" ] || continue
            curl --fail --silent --show-error --location "https://gadgetpoint.ng${asset}" -o /tmp/asset.js || continue
            cat /tmp/asset.js >> /tmp/all.js
            echo >> /tmp/all.js
          done < /tmp/assets.txt

          echo '=== WORKFLOWOS ACCESS TEXT CONTEXT ==='
          grep -Eoi '.{0,420}(WorkflowOS access is not configured yet|workflowos_access|workflowos|clock in|staff login).{0,900}' /tmp/all.js | head -n 220 || true

          echo '=== STAFF / WORKFLOW API STRINGS ==='
          grep -Eo '/api/[A-Za-z0-9_?&=./:{}-]+' /tmp/all.js | sort -u | grep -Ei '(staff|workflow|auth|login|clock|attendance|profile|admin)' | head -n 300 || true

          echo '=== CONFIG / CALLBACK STRINGS ==='
          grep -Eoi '.{0,260}(WORKFLOWOS|callback|return_to|access_enabled|permissions|staff-login|owner-login).{0,500}' /tmp/all.js | head -n 200 || true
