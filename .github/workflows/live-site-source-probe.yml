name: Trace live GadgetPoint Admin messaging surface

on:
  push:
    branches:
      - domain-health-probe

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect live Admin assets and messaging routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://gadgetpoint.ng/admin -o /tmp/admin.html
          echo '=== ADMIN HTML HEAD ==='
          head -c 2500 /tmp/admin.html | tr '\n' ' '
          echo

          echo '=== SCRIPT ASSETS ==='
          grep -Eo '(src|href)="/[^"]+\.js[^" ]*"' /tmp/admin.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u > /tmp/admin-assets.txt || true
          cat /tmp/admin-assets.txt

          : > /tmp/all-admin.js
          while read -r asset; do
            [ -n "$asset" ] || continue
            echo "fetching ${asset}"
            curl --fail --silent --show-error --location "https://gadgetpoint.ng${asset}" -o /tmp/asset.js || continue
            cat /tmp/asset.js >> /tmp/all-admin.js
            echo >> /tmp/all-admin.js
          done < /tmp/admin-assets.txt

          echo '=== API ROUTES ==='
          grep -Eo '/api/[A-Za-z0-9_?&=./:{}-]+' /tmp/all-admin.js | sort -u | head -n 400 || true

          echo '=== MESSAGING / WORKFLOW CONTEXT ==='
          grep -Eoi '.{0,180}(message|messenger|chat|inbox|workflowos|staffEmail|externalStaffId|staffUsername|sendMessage|markRead).{0,220}' /tmp/all-admin.js | head -n 260 || true

          echo '=== ROUTE CANDIDATE PROBES ==='
          for path in \
            /api/workflowos/messages \
            /api/workflowos/message \
            /api/messages \
            /api/admin/messages \
            /api/staff/messages \
            /api/messenger \
            /api/chat \
            /api/admin-chat \
            /api/workflowos/chat
          do
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 15 --output "$body" --write-out '%{http_code}' "https://gadgetpoint.ng${path}" || true)"
            printf '%s -> HTTP %s :: ' "$path" "${status:-curl-error}"
            head -c 180 "$body" | tr '\n' ' '
            echo
            rm -f "$body"
          done
