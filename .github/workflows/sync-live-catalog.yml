name: Sync live GadgetPoint catalog to WorkflowOS

# Comment-only freshness trigger: keep the production mirror current while scheduled GitHub runs remain best-effort.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-live-catalog.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: workflowos-live-catalog-sync
  cancel-in-progress: false

env:
  WORKFLOWOS_CATALOG_SYNC_URL: https://hasnhivdrpeqytgdnkzo.supabase.co/functions/v1/gadgetpoint-live-catalog-sync
  WORKFLOWOS_CATALOG_SYNC_AUDIENCE: workflowos-gadgetpoint-catalog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC identity and sync production catalog
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

          TOKEN_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${WORKFLOWOS_CATALOG_SYNC_AUDIENCE}")

          OIDC_TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | jq -r '.value // empty')
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --request POST \
            --header "content-type: application/json" \
            --header "authorization: Bearer ${OIDC_TOKEN}" \
            --data '{}' \
            "$WORKFLOWOS_CATALOG_SYNC_URL"
